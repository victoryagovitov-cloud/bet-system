name: Football signals daily

on:
  schedule:
    # МСК = UTC+3 → 08:00 / 14:00 / 20:00 МСК
    - cron: "0 5 * * *"
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (optional; default today+tomorrow MSK)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: football-signals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football-signals/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Write .env from secrets/vars
        env:
          API_SPORT_KEY: ${{ secrets.API_SPORT_KEY }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_CHAT_ID: ${{ secrets.MAX_CHANNEL_CHAT_ID }}
          NEWS_LLM_API_KEY: ${{ secrets.NEWS_LLM_API_KEY }}
          LOGIC_LLM_API_KEY: ${{ secrets.LOGIC_LLM_API_KEY }}
          BANKROLL_AMOUNT: ${{ secrets.BANKROLL_AMOUNT }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}
          LLM_QUALITY_ENABLED: ${{ vars.LLM_QUALITY_ENABLED }}
          NEWS_LLM_ENABLED: ${{ vars.NEWS_LLM_ENABLED }}
          LOGIC_LLM_ENABLED: ${{ vars.LOGIC_LLM_ENABLED }}
          LOCK_SIGNALS_ENABLED: ${{ vars.LOCK_SIGNALS_ENABLED }}
          LOGIC_LLM_MODEL: ${{ vars.LOGIC_LLM_MODEL }}
          LOGIC_LLM_FALLBACK_MODEL: ${{ vars.LOGIC_LLM_FALLBACK_MODEL }}
          NEWS_LLM_MODEL: ${{ vars.NEWS_LLM_MODEL }}
          MIN_EDGE: ${{ vars.MIN_EDGE }}
          MAX_EDGE: ${{ vars.MAX_EDGE }}
          MAX_VALUE_SIGNALS_PER_RUN: ${{ vars.MAX_VALUE_SIGNALS_PER_RUN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          def g(key: str, default: str = "") -> str:
              return (os.environ.get(key) or default).strip()

          logic_key = g("LOGIC_LLM_API_KEY")
          lines = {
              "API_SPORT_BASE_URL": "https://api.api-sport.ru",
              "API_SPORT_KEY": g("API_SPORT_KEY"),
              "API_SPORT_SPORT_SLUG": "football",
              "BOOKMAKERS_WHITELIST": "marathon,melbet,betboom,pari",
              "MAX_BOT_TOKEN": g("MAX_BOT_TOKEN"),
              "MAX_CHANNEL_CHAT_ID": g("MAX_CHANNEL_CHAT_ID"),
              "PUBLISH_MODE": g("PUBLISH_MODE", "dry_run"),
              "MIN_MODEL_PROBABILITY": "0.80",
              "MIN_EDGE": g("MIN_EDGE", "0.02"),
              "MAX_EDGE": g("MAX_EDGE", "0.15"),
              "MAX_VALUE_SIGNALS_PER_RUN": g("MAX_VALUE_SIGNALS_PER_RUN", "7"),
              "STAKE_HARD_CAP_FRACTION": "0.0333",
              "KELLY_FRACTION_MODE": "quarter",
              "BANKROLL_AMOUNT": g("BANKROLL_AMOUNT", "30000"),
              "TIMEZONE": "Europe/Moscow",
              "DATABASE_URL": "sqlite:///data/signals.db",
              "ODDS_SPREAD_ANOMALY_THRESHOLD": "0.80",
              "LLM_QUALITY_ENABLED": g("LLM_QUALITY_ENABLED", "false"),
              "NEWS_LLM_ENABLED": g("NEWS_LLM_ENABLED", "false"),
              "NEWS_LLM_API_KEY": g("NEWS_LLM_API_KEY"),
              "NEWS_LLM_BASE_URL": "https://api.perplexity.ai",
              "NEWS_LLM_MODEL": g("NEWS_LLM_MODEL", "sonar-pro"),
              "LOGIC_LLM_ENABLED": g("LOGIC_LLM_ENABLED", "false"),
              "LOGIC_LLM_API_KEY": logic_key,
              "LOGIC_LLM_BASE_URL": "https://api.aitunnel.ru/v1",
              "LOGIC_LLM_MODEL": g("LOGIC_LLM_MODEL", "deepseek-v4-pro"),
              # Резерв: та же сеть/ключ, более стабильная «обычная» модель
              "LOGIC_LLM_FALLBACK_API_KEY": logic_key,
              "LOGIC_LLM_FALLBACK_BASE_URL": "https://api.aitunnel.ru/v1",
              "LOGIC_LLM_FALLBACK_MODEL": g("LOGIC_LLM_FALLBACK_MODEL", "deepseek-chat"),
              "LOCK_SIGNALS_ENABLED": g("LOCK_SIGNALS_ENABLED", "true"),
              "LOCK_MIN_MODEL_PROBABILITY": "0.78",
              "LOCK_ODDS_MIN": "1.12",
              "LOCK_ODDS_MAX": "1.45",
              "LOCK_LLM_API_KEY": logic_key,
              "LOCK_LLM_BASE_URL": "https://api.aitunnel.ru/v1",
              "LOCK_LLM_MODEL": g("LOGIC_LLM_MODEL", "deepseek-v4-pro"),
              "LOCK_LLM_FALLBACK_API_KEY": logic_key,
              "LOCK_LLM_FALLBACK_BASE_URL": "https://api.aitunnel.ru/v1",
              "LOCK_LLM_FALLBACK_MODEL": g("LOGIC_LLM_FALLBACK_MODEL", "deepseek-chat"),
          }
          Path(".env").write_text(
              "\n".join(f"{k}={v}" for k, v in lines.items()) + "\n",
              encoding="utf-8",
          )
          print("wrote .env keys:", ", ".join(lines))
          PY

      - name: Run daily signals
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/run_daily.py --date "${{ github.event.inputs.date }}"
          else
            python scripts/run_daily.py
          fi

      - name: Track / settle results
        # Grades finished matches; publishes compact УЧЁТ to MAX when --publish.
        run: python scripts/track_results.py --publish
        continue-on-error: true

      - name: Commit SQLite + calibration snapshot
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p football-signals/data
          git add -f football-signals/data/signals.db || true
          git add -f football-signals/data/calibration_latest.json || true
          if git diff --staged --quiet; then
            echo "No stats changes to commit"
          else
            git commit -m "chore: update signals.db after scheduled run"
            git push
          fi
